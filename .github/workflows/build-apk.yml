name: Build Android TV app
on:
  push:
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
env:
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks/zedtv.jks"
            echo "::notice::Signed with your saved key (updates install over the old version)."
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks/zedtv.jks" -alias zedtv -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=ZED.TV"
            echo "::warning::No KEYSTORE_BASE64 secret, so a new key was made. Uninstall the old app before installing this build."
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/ks/zedtv.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk zedtv.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app zedtv.apk --target "$GITHUB_SHA" \
            --title "ZED.TV (build ${{ github.run_number }})" \
            --notes "ZED.TV Android TV app. Download: https://github.com/${{ github.repository }}/releases/download/app/zedtv.apk"
      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rq --cached . || true
          git add -f build.log
          git commit -qm "Build log for run ${{ github.run_number }}"
          git push -f origin ci-logs
